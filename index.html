<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠️ viewport-fit=cover IS LOAD-BEARING, NOT DECORATION.
         Without it iOS reports every env(safe-area-inset-*) as 0, and this
         codebase reads those insets in nine places to keep the interface
         clear of the notch and the home indicator. All of that work was
         silently doing nothing on an iPhone: the layout simply sat under
         the hardware. Adding it here is what switches the insets on. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RAW Official | Performance & Recovery Protocol</title>
    <meta name="description" content="Premium performance and recovery brand. Live your life RAW - Train with intent, recover with purpose." />
    <meta name="author" content="RAW Official" />
    <meta name="keywords" content="performance, recovery, training, nutrients, combat, gear" />
    <meta property="og:title" content="RAW Official" />
    <meta property="og:description" content="Premium performance and recovery brand. Live your life RAW - Train with intent, recover with purpose." />
    <meta property="og:type" content="website" />
    <!-- The AI Studio Cloud Run URL that used to sit here was a build-time
         scratch address; a shared link showed it as the site's identity. -->
    <meta property="og:url" content="https://www.rawprotection.com" />
    <meta property="og:site_name" content="RAW Official" />
    <meta property="og:image" content="/brand/share-card.jpg" />
    <meta property="og:image:alt" content="STAY SAFE WITH RAW — 100,000 free condoms. No catch." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RAW Official — Stay Safe With RAW" />
    <meta name="twitter:description" content="100,000 free condoms. No catch. Sex is part of life. Protection should be too." />
    <meta name="twitter:image" content="/brand/share-card.jpg" />
    <meta name="theme-color" content="#dc2626" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RAW" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- iOS fills a square and never letterboxes. This pointed at the
         813x348 wordmark strip, so the home-screen icon was a smear of it.
         Square icons are generated by scripts/make-icons.mjs. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/app-icon-180.png" />
    <!-- Google Analytics: Replace UA-XXXXX-Y with your tracking ID -->
    <!-- <script async src="https://www.googletagmanager.com/gtag/js?id=UA-XXXXX-Y"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'UA-XXXXX-Y');
    </script> -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
